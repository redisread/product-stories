name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 代码质量检查（PR 和 push 都执行）
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # 安全扫描
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # 部署（仅 main 分支 push 或 PR）
  deploy:
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://product-stories.pages.dev' }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.head.sha }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
          echo "Build size: $(du -sh dist | cut -f1)"

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sm dist | cut -f1)
          WARN_SIZE=5
          FAIL_SIZE=10

          echo "Bundle size: ${BUNDLE_SIZE}MB"
          echo "Warning threshold: ${WARN_SIZE}MB"
          echo "Failure threshold: ${FAIL_SIZE}MB"

          if [ "$BUNDLE_SIZE" -ge "$FAIL_SIZE" ]; then
            echo "❌ ERROR: Bundle size exceeds failure threshold!"
            exit 1
          elif [ "$BUNDLE_SIZE" -ge "$WARN_SIZE" ]; then
            echo "⚠️ WARNING: Bundle size exceeds warning threshold"
            echo "::warning file=dist,title=Bundle Size::Bundle size is ${BUNDLE_SIZE}MB, exceeds warning threshold of ${WARN_SIZE}MB"
          else
            echo "✅ Bundle size is within acceptable limits"
          fi

          # Output for GitHub Actions summary
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Size | ${BUNDLE_SIZE}MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Warning Threshold | ${WARN_SIZE}MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Failure Threshold | ${FAIL_SIZE}MB |" >> $GITHUB_STEP_SUMMARY

          # List top 10 largest files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top 10 Largest Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -type f -exec du -k {} + | sort -nr | head -10 | awk '{printf "%.2fMB\t%s\n", $1/1024, $2}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: product-stories
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment ready!\n\n**Preview URL:** ${{ steps.deploy.outputs.url }}`
            })
