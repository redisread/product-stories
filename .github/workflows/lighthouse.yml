name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://product-stories.pages.dev

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/results.json', 'utf8'));

            const perfScore = Math.round(results[0].scores.performance * 100);
            const a11yScore = Math.round(results[0].scores.accessibility * 100);
            const seoScore = Math.round(results[0].scores.seo * 100);
            const bcpScore = Math.round(results[0].scores['best-practices'] * 100);

            const metrics = results[0].auditResults.find(a => a.id === 'metrics')?.details?.items[0] || {};

            const comment = `## 🔦 Lighthouse Report

            | Category | Score |
            |----------|-------|
            | Performance | ${perfScore} |
            | Accessibility | ${a11yScore} |
            | SEO | ${seoScore} |
            | Best Practices | ${bcpScore} |

            ### Key Metrics
            - **FCP**: ${metrics.firstContentfulPaint ? (metrics.firstContentfulPaint / 1000).toFixed(2) + 's' : 'N/A'}
            - **LCP**: ${metrics.largestContentfulPaint ? (metrics.largestContentfulPaint / 1000).toFixed(2) + 's' : 'N/A'}
            - **CLS**: ${metrics.cumulativeLayoutShift?.toFixed(3) || 'N/A'}
            - **TBT**: ${metrics.totalBlockingTime ? Math.round(metrics.totalBlockingTime) + 'ms' : 'N/A'}

            [View full report](${{ steps.lighthouse.outputs.links }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
