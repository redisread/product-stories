name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://product-stories.pages.dev

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const links = `${{ steps.lighthouse.outputs.links }}`.trim();
            const reportLinks = links
              ? links
                  .split(/\s+/)
                  .map((link, index) => `- [Report ${index + 1}](${link})`)
                  .join('\n')
              : '- Lighthouse reports are available in the workflow artifacts.';

            const comment = `## 🔦 Lighthouse Report

            Lighthouse CI completed. Assertions are enforced by the workflow; timing budgets are reported as warnings.

            ${reportLinks}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
