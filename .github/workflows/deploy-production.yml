name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx astro check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    needs: [quality, security]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory 'dist' not found"
            exit 1
          fi
          echo "Build size: $(du -sh dist | cut -f1)"
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sm dist | cut -f1)
          WARN_SIZE=5
          FAIL_SIZE=10
          echo "Bundle size: ${BUNDLE_SIZE}MB"
          if [ "$BUNDLE_SIZE" -ge "$FAIL_SIZE" ]; then
            echo "❌ Bundle size exceeds failure threshold!"
            exit 1
          elif [ "$BUNDLE_SIZE" -ge "$WARN_SIZE" ]; then
            echo "⚠️ Bundle size exceeds warning threshold"
          else
            echo "✅ Bundle size OK"
          fi
      - name: Deploy to Production
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: product-stories
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
          branch: main
