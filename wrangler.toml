name = "product-stories"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# 构建命令
[build]
command = "npm run build:cf"

# 静态资源目录
[site]
bucket = "./dist"

# 生产环境变量
[env.production]
vars = { ENVIRONMENT = "production" }

# 预览环境变量
[env.preview]
vars = { ENVIRONMENT = "preview" }
